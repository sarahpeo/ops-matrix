<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Operations Matrix</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /* ── CONFIG: edit your API key at the bottom of this file ── */

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #f0f2f5;
      --surface:   #ffffff;
      --border:    #e2e6ea;
      --text:      #1a2332;
      --muted:     #6b7a8d;
      --green:     #22c55e;
      --green-bg:  #dcfce7;
      --red:       #ef4444;
      --red-bg:    #fee2e2;
      --amber:     #f59e0b;
      --amber-bg:  #fef3c7;
      --gray:      #94a3b8;
      --gray-bg:   #e2e8f0;
      --depot:     #3b82f6;
      --depot-bg:  #dbeafe;
      --header-h:  64px;
      --row-h:     72px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      font-family: 'Inter', sans-serif;
      color: var(--text);
      overflow: hidden;
    }

    /* ── HEADER ── */
    header {
      height: var(--header-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      position: sticky;
      top: 0;
      z-index: 100;
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .r4m-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 15px;
      color: var(--text);
    }

    .r4m-logo svg { flex-shrink: 0; }

    .divider {
      width: 1px;
      height: 28px;
      background: var(--border);
    }

    .page-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
    }

    .page-date {
      font-size: 13px;
      color: var(--muted);
      font-weight: 400;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .live-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #dcfce7;
      border: 1px solid #86efac;
      border-radius: 100px;
      padding: 4px 12px;
      font-size: 11px;
      font-weight: 600;
      color: #16a34a;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .live-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #16a34a;
      animation: livePulse 1.5s ease infinite;
    }

    @keyframes livePulse {
      0%,100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.5; transform: scale(0.8); }
    }

    #clock {
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
      letter-spacing: 1px;
    }

    #refresh-info {
      font-size: 11px;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
    }

    /* ── LEGEND BAR ── */
    #legend-bar {
      height: 40px;
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 28px;
      flex-shrink: 0;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 11px;
      color: var(--muted);
      font-weight: 500;
    }

    .legend-swatch {
      width: 16px; height: 16px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .legend-swatch.green  { background: var(--green); }
    .legend-swatch.amber  { background: var(--amber); }
    .legend-swatch.red    { background: var(--red); }
    .legend-swatch.gray   { background: var(--gray-bg); border: 1px solid var(--border); }
    .legend-swatch.depot  { background: var(--depot); }

    .legend-sep { width: 1px; height: 18px; background: var(--border); }

    #summary-stats {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 12px;
    }

    .stat {
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--muted);
      font-weight: 500;
    }

    .stat b { color: var(--text); font-size: 13px; }

    /* ── MAIN SCROLL AREA ── */
    #main {
      height: calc(100vh - var(--header-h) - 40px);
      overflow-y: auto;
      overflow-x: hidden;
    }

    #main::-webkit-scrollbar { width: 4px; }
    #main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ── MATRIX TABLE ── */
    #matrix-wrap {
      min-width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    /* Column sizing */
    .col-driver  { width: 260px; min-width: 260px; }
    .col-stops   { width: calc(100% - 260px); }

    /* ── DRIVER COLUMN ── */
    td.driver-cell {
      height: var(--row-h);
      padding: 0 16px 0 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      vertical-align: middle;
      position: sticky;
      left: 0;
      z-index: 10;
    }

    .driver-inner {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .driver-avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px;
      font-weight: 700;
      color: white;
      flex-shrink: 0;
    }

    .driver-info { min-width: 0; }

    .driver-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .driver-route {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }

    .driver-kpis {
      margin-left: auto;
      text-align: right;
      flex-shrink: 0;
    }

    .kpi-row {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
      font-size: 10px;
      color: var(--muted);
      line-height: 1.6;
    }

    .kpi-pct {
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
    }

    .kpi-green { color: var(--green); }
    .kpi-red   { color: var(--red); }
    .kpi-amber { color: var(--amber); }
    .kpi-gray  { color: var(--gray); }

    /* ── STOPS CELL ── */
    td.stops-cell {
      height: var(--row-h);
      padding: 0 24px 0 12px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      vertical-align: middle;
    }

    .stops-row {
      display: flex;
      align-items: center;
      gap: 3px;
      flex-wrap: nowrap;
      overflow: hidden;
    }

    /* ── STOP BOX ── */
    .stop-box {
      width: 28px;
      height: 36px;
      border-radius: 4px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 600;
      cursor: default;
      position: relative;
      transition: transform 0.1s;
    }

    .stop-box:hover { transform: scaleY(1.15); z-index: 5; }

    /* visited states */
    .stop-green  { background: var(--green);  color: white; }
    .stop-amber  { background: var(--amber);  color: white; }
    .stop-red    { background: var(--red);    color: white; }
    /* not yet visited */
    .stop-pending { background: var(--gray-bg); color: var(--gray); border: 1px solid var(--border); }
    /* depot */
    .stop-depot  { background: var(--depot);  color: white; border-radius: 6px; }

    /* ── PROGRESS BAR under driver name ── */
    .progress-bar-wrap {
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      margin-top: 5px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      border-radius: 2px;
      background: var(--green);
      transition: width 0.6s ease;
    }

    /* ── EMPTY / LOADING / ERROR STATES ── */
    #status-overlay {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 16px;
      padding: 40px;
      text-align: center;
    }

    .status-icon { font-size: 48px; }

    .status-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
    }

    .status-body {
      font-size: 13px;
      color: var(--muted);
      max-width: 480px;
      line-height: 1.7;
    }

    .config-block {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--text);
      line-height: 2;
      text-align: left;
      max-width: 500px;
      width: 100%;
    }

    .config-block .k { color: #6366f1; }
    .config-block .v { color: #059669; }

    /* ── SKELETON ── */
    .skel-row td {
      border-bottom: 1px solid var(--border);
      height: var(--row-h);
    }

    .skel-driver {
      background: var(--surface);
      padding: 0 16px 0 24px;
    }

    .skel-stops { background: var(--bg); }

    .skel-pulse {
      border-radius: 6px;
      background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
      background-size: 200% 100%;
      animation: skelAnim 1.4s ease infinite;
    }

    @keyframes skelAnim {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ── AVATAR COLORS (cycle through) ── */
    .av-0 { background: #6366f1; }
    .av-1 { background: #f59e0b; }
    .av-2 { background: #10b981; }
    .av-3 { background: #ef4444; }
    .av-4 { background: #8b5cf6; }
    .av-5 { background: #ec4899; }
    .av-6 { background: #14b8a6; }
    .av-7 { background: #f97316; }
  </style>
</head>
<body>

<!-- ╔══════════════════════════════════════════╗
     ║  var R4M_API_KEY = '750C0F68B7E17EA8734F5FAED440CA75';                ║
     ╚══════════════════════════════════════════╝ -->
<script>
  var R4M_API_KEY   = 'YOUR_ROUTE4ME_API_KEY_HERE';
  var REFRESH_MINS  = 2;    // auto-refresh interval
  var MAX_ROUTES    = 20;   // max drivers/routes to show
  // Schedule threshold in seconds (5 min = 300s, matching Route4Me's own logic)
  var SCHEDULE_THRESHOLD = 300;
</script>

<!-- HEADER -->
<header>
  <div class="header-left">
    <div class="r4m-logo">
      <!-- Route4Me-style lightning bolt icon -->
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path d="M13 2L4.5 13.5H11L10 22L20.5 10H14L13 2Z" fill="#f59e0b" stroke="#d97706" stroke-width="0.5"/>
      </svg>
      Route4Me
    </div>
    <div class="divider"></div>
    <div>
      <div class="page-title">Operations Matrix</div>
      <div class="page-date" id="page-date">—</div>
    </div>
  </div>
  <div class="header-right">
    <div id="refresh-info">refresh in —</div>
    <div id="clock">--:--:--</div>
    <div class="live-pill"><div class="live-dot"></div>Live</div>
  </div>
</header>

<!-- LEGEND -->
<div id="legend-bar">
  <div class="legend-item">
    <div class="legend-swatch depot"></div> Depot
  </div>
  <div class="legend-sep"></div>
  <div class="legend-item">
    <div class="legend-swatch green"></div> Ahead of Schedule
  </div>
  <div class="legend-item">
    <div class="legend-swatch amber"></div> On Time
  </div>
  <div class="legend-item">
    <div class="legend-swatch red"></div> Behind Schedule
  </div>
  <div class="legend-item">
    <div class="legend-swatch gray"></div> Pending
  </div>
  <div id="summary-stats">
    <div class="stat">Routes: <b id="s-routes">—</b></div>
    <div class="stat">Total Stops: <b id="s-stops">—</b></div>
    <div class="stat">Visited: <b id="s-visited">—</b></div>
    <div class="stat">Progress: <b id="s-pct">—</b></div>
  </div>
</div>

<!-- MAIN -->
<div id="main">
  <!-- Status overlay (loading / error / config) -->
  <div id="status-overlay">
    <div class="status-icon" id="s-icon">⏳</div>
    <div class="status-title" id="s-title">Loading routes…</div>
    <div class="status-body"  id="s-body"></div>
    <div class="config-block" id="s-config" style="display:none"></div>
  </div>

  <!-- Matrix table -->
  <div id="matrix-wrap" style="display:none">
    <table id="matrix-table">
      <colgroup>
        <col class="col-driver">
        <col class="col-stops">
      </colgroup>
      <tbody id="matrix-body"></tbody>
    </table>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ── Helpers ──────────────────────────────────────────────────────────────────
  function el(id)  { return document.getElementById(id); }
  function fmt(ts) {
    if (!ts) return '—';
    var d = new Date(ts * 1000);
    return d.toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit', hour12:true });
  }

  function initials(name) {
    if (!name) return '?';
    var parts = name.trim().split(' ');
    return (parts[0][0] + (parts[1] ? parts[1][0] : '')).toUpperCase();
  }

  // ── Clock ────────────────────────────────────────────────────────────────────
  function updateClock() {
    var now = new Date();
    el('clock').textContent = now.toLocaleTimeString('en-US', { hour12: false });
    el('page-date').textContent = now.toLocaleDateString('en-US', {
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
    });
  }
  setInterval(updateClock, 1000);
  updateClock();

  // ── Countdown ────────────────────────────────────────────────────────────────
  var secs = REFRESH_MINS * 60;
  setInterval(function () {
    secs--;
    if (secs <= 0) { secs = REFRESH_MINS * 60; fetchRoutes(); }
    var m = Math.floor(secs / 60), s = secs % 60;
    el('refresh-info').textContent = 'refresh in ' + m + ':' + (s < 10 ? '0' : '') + s;
  }, 1000);

  // ── UI state ─────────────────────────────────────────────────────────────────
  function showOverlay(icon, title, body, configHtml) {
    el('matrix-wrap').style.display = 'none';
    var ov = el('status-overlay');
    ov.style.display = 'flex';
    el('s-icon').textContent   = icon;
    el('s-title').textContent  = title;
    el('s-body').textContent   = body;
    var cfg = el('s-config');
    if (configHtml) { cfg.style.display = 'block'; cfg.innerHTML = configHtml; }
    else cfg.style.display = 'none';
  }

  function showMatrix() {
    el('status-overlay').style.display = 'none';
    el('matrix-wrap').style.display = 'block';
  }

  function showSkeletons() {
    showMatrix();
    var tbody = el('matrix-body');
    tbody.innerHTML = '';
    for (var i = 0; i < 5; i++) {
      tbody.innerHTML +=
        '<tr class="skel-row">' +
          '<td class="driver-cell skel-driver">' +
            '<div style="display:flex;align-items:center;gap:12px">' +
              '<div class="skel-pulse" style="width:36px;height:36px;border-radius:50%"></div>' +
              '<div>' +
                '<div class="skel-pulse" style="width:120px;height:12px;border-radius:4px;margin-bottom:6px"></div>' +
                '<div class="skel-pulse" style="width:80px;height:10px;border-radius:4px"></div>' +
              '</div>' +
            '</div>' +
          '</td>' +
          '<td class="stops-cell skel-stops">' +
            '<div style="display:flex;gap:3px">' +
              Array(12).fill('<div class="skel-pulse" style="width:28px;height:36px;border-radius:4px"></div>').join('') +
            '</div>' +
          '</td>' +
        '</tr>';
    }
  }

  // ── Stop box color logic ──────────────────────────────────────────────────────
  // Matches Route4Me's exact rules:
  // Green  = visited >= 5min EARLY  (actual < planned - 300)
  // Amber  = visited WITHIN 5min    (|actual - planned| <= 300)
  // Red    = visited >= 5min LATE   (actual > planned + 300)
  // Pending = not yet visited
  // Depot  = is_depot
  function stopClass(addr) {
    if (addr.is_depot) return 'stop-depot';
    if (!addr.is_visited) return 'stop-pending';

    var visited  = addr.timestamp_last_visited || addr.visited_at_ts;
    var planned  = addr.planned_time_window_start || addr.time_window_start;

    // If no planned time, fall back to gray "on time"
    if (!planned || !visited) return 'stop-amber';

    var diff = visited - planned; // positive = late, negative = early
    if (diff < -SCHEDULE_THRESHOLD) return 'stop-green';   // ahead of schedule
    if (diff >  SCHEDULE_THRESHOLD) return 'stop-red';     // behind schedule
    return 'stop-amber';                                    // on time
  }

  function stopLabel(addr) {
    if (addr.is_depot) return '🏠';
    if (!addr.is_visited) return addr.sequence_no || '';
    return '✓';
  }

  // ── Render one driver row ────────────────────────────────────────────────────
  function renderRow(route, idx) {
    var addrs     = route.addresses || [];
    var name      = route.params && route.params.member_first_name
                    ? (route.params.member_first_name + ' ' + (route.params.member_last_name || '')).trim()
                    : (route.driver_alias || route.params && route.params.route_name || 'Driver ' + (idx + 1));
    var routeName = route.params && route.params.route_name ? route.params.route_name : '';

    var totalStops   = addrs.filter(function(a) { return !a.is_depot; }).length;
    var visitedStops = addrs.filter(function(a) { return !a.is_depot && a.is_visited; }).length;
    var pct          = totalStops ? Math.round((visitedStops / totalStops) * 100) : 0;

    // KPI counts
    var early = 0, ontime = 0, late = 0;
    addrs.forEach(function(a) {
      if (a.is_depot || !a.is_visited) return;
      var cls = stopClass(a);
      if (cls === 'stop-green') early++;
      else if (cls === 'stop-red') late++;
      else ontime++;
    });
    var earlyPct  = visitedStops ? Math.round((early  / visitedStops) * 100) : 0;
    var latePct   = visitedStops ? Math.round((late   / visitedStops) * 100) : 0;
    var ontimePct = visitedStops ? Math.round((ontime / visitedStops) * 100) : 0;

    var avClass = 'av-' + (idx % 8);

    // Build stop boxes HTML
    var boxesHtml = addrs.map(function(addr, si) {
      var cls   = stopClass(addr);
      var label = stopLabel(addr);
      var title = addr.original_data && addr.original_data.city
                  ? addr.original_data.city
                  : (addr.address_stop_type || '');
      return '<div class="stop-box ' + cls + '" title="' + (addr.original_data ? addr.original_data.original_address || '' : addr.address || '') + '" >' +
               label +
             '</div>';
    }).join('');

    var tr = document.createElement('tr');
    tr.innerHTML =
      '<td class="driver-cell">' +
        '<div class="driver-inner">' +
          '<div class="driver-avatar ' + avClass + '">' + initials(name) + '</div>' +
          '<div class="driver-info">' +
            '<div class="driver-name">' + name + '</div>' +
            '<div class="driver-route">' + routeName + '</div>' +
            '<div class="progress-bar-wrap">' +
              '<div class="progress-bar-fill" style="width:' + pct + '%"></div>' +
            '</div>' +
          '</div>' +
          '<div class="driver-kpis">' +
            '<div class="kpi-row"><span>On Time:</span><span class="kpi-pct kpi-amber">' + ontimePct + '%</span></div>' +
            '<div class="kpi-row"><span>Early:</span><span class="kpi-pct kpi-green">' + earlyPct + '%</span></div>' +
            '<div class="kpi-row"><span>Late:</span><span class="kpi-pct kpi-red">' + latePct + '%</span></div>' +
          '</div>' +
        '</div>' +
      '</td>' +
      '<td class="stops-cell">' +
        '<div class="stops-row">' + boxesHtml + '</div>' +
      '</td>';

    return tr;
  }

  // ── Summary stats ────────────────────────────────────────────────────────────
  function updateSummary(routes) {
    var totalRoutes  = routes.length;
    var totalStops   = 0, totalVisited = 0;
    routes.forEach(function(r) {
      var addrs = r.addresses || [];
      addrs.forEach(function(a) {
        if (a.is_depot) return;
        totalStops++;
        if (a.is_visited) totalVisited++;
      });
    });
    var pct = totalStops ? Math.round((totalVisited / totalStops) * 100) : 0;
    el('s-routes').textContent  = totalRoutes;
    el('s-stops').textContent   = totalStops;
    el('s-visited').textContent = totalVisited;
    el('s-pct').textContent     = pct + '%';
  }

  // ── Fetch ─────────────────────────────────────────────────────────────────────
  function fetchRoutes() {
    if (!R4M_API_KEY || R4M_API_KEY === 'YOUR_ROUTE4ME_API_KEY_HERE') {
      showOverlay('⚙️', 'Setup Required', 'Edit the API key at the top of this file:',
        '<span class="k">R4M_API_KEY</span> = <span class="v">"your-32-char-key-here"</span><br><br>' +
        'Find it in Route4Me → My Account → API'
      );
      return;
    }

    showSkeletons();

    // Fetch today's routes with full address data (is_visited, timestamps, etc.)
    var url = 'https://api.route4me.com/api.v4/route.php' +
      '?api_key=' + R4M_API_KEY +
      '&limit=' + MAX_ROUTES +
      '&offset=0' +
      '&directions=0' +
      '&route_path_output=None' +
      '&devices=0' +
      '&original=1';

    fetch(url)
      .then(function(r) {
        if (!r.ok) throw new Error('HTTP ' + r.status + ' — check your API key');
        return r.json();
      })
      .then(function(data) {
        var routes = Array.isArray(data) ? data : (data.data || []);

        // Filter to today's routes only
        var todayStart = Math.floor(new Date().setHours(0,0,0,0) / 1000);
        var todayEnd   = todayStart + 86400;
        var todayRoutes = routes.filter(function(r) {
          var ts = r.params && r.params.route_date;
          // If no date set, include it; otherwise filter to today
          return !ts || (ts >= todayStart && ts < todayEnd);
        });

        // Fall back to all routes if none match today's date filter
        if (!todayRoutes.length) todayRoutes = routes;

        if (!todayRoutes.length) {
          showOverlay('📭', 'No Routes Today',
            'No routes found for today. Routes will appear here once they are dispatched in Route4Me.',
            '');
          el('s-routes').textContent = el('s-stops').textContent =
          el('s-visited').textContent = el('s-pct').textContent = '0';
          return;
        }

        // Sort: routes with activity first, then by name
        todayRoutes.sort(function(a, b) {
          var aV = (a.visited_count || 0), bV = (b.visited_count || 0);
          if (bV !== aV) return bV - aV;
          var an = (a.params && a.params.route_name) || '';
          var bn = (b.params && b.params.route_name) || '';
          return an.localeCompare(bn);
        });

        updateSummary(todayRoutes);
        showMatrix();

        var tbody = el('matrix-body');
        tbody.innerHTML = '';
        todayRoutes.forEach(function(route, idx) {
          tbody.appendChild(renderRow(route, idx));
        });
      })
      .catch(function(err) {
        console.error(err);
        showOverlay('⚠️', 'Could Not Load Data', err.message +
          '\n\nIf you see a CORS error, host this file on a server (e.g. Netlify Drop) ' +
          'instead of opening it directly from your filesystem.',
          '');
      });
  }

  fetchRoutes();
})();
</script>
